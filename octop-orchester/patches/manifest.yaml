# Patch registry for octop-orchester.
#
# Layout: patches/<path identical to octop/>.<patch-id>.patch
#         New files (no diff) live in octop-orchester/src/<path identical to octop/>.
#
# One YAML document per patch, separated by `---`. No script parses this file
# today; it is read by humans and by the rebase workflow in README §8.
---
patch:
  id: vi-i18n
  name: Vietnamese (vi) UI localization
  target_repo: octop
  base_commit: 890111b7
  base_describe: v0.9.16-824-g890111b7   # `git -C octop describe`
  base_tag: v1.0.3b1                      # tag pointing at base_commit
  status: active
  doc: README.md
  applies_to:
    - dashboard/src/App.tsx
    - dashboard/src/api/modules/decision.ts
    - dashboard/src/api/request.ts
    - dashboard/src/components/AvatarDropdown.tsx
    - dashboard/src/i18n.ts
    - dashboard/src/locales/en.json
    - dashboard/src/locales/zh.json
    - dashboard/src/pages/Invite/index.tsx
    - dashboard/src/pages/Setup/index.tsx
    - dashboard/src/utils/localePrefs.ts
    - src/octop/api/routers/preferences.py
    - src/octop/i18n/loader.py
    - src/octop/infra/utils/locale.py
  adds:
    - src/dashboard/src/locales/vi.json
    - src/src/octop/i18n/vi.json
---
