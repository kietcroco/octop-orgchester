patch:
  id: webhook
  name: Agent event webhooks (signed outbound delivery of every trajectory event)
  target_repo: octop
  base_commit: 890111b7
  base_describe: v0.9.16-824-g890111b7
  base_tag: v1.0.3b1
  status: active
  doc: docs/03-WEBHOOK-ARCHITECTURE.md
  # Depends on the `agency` patch: overlay migration runner (run_overlay_migrations)
  # is installed by that patch, and 002_webhook only adds files to its folder.
  depends_on:
    - agency
  applies_to:
    - dashboard/src/locales/en.json
    - dashboard/src/locales/zh.json
    - dashboard/src/pages/Settings/AdvancedSettings/index.tsx
    - dashboard/src/utils/permissions.ts
    - src/octop/api/app.py
    - src/octop/infra/history/trajectory/service.py
    - src/octop/infra/server.py
  adds:
    - src/dashboard/src/api/modules/webhooks.ts
    - src/dashboard/src/pages/Settings/Webhooks/index.module.less
    - src/dashboard/src/pages/Settings/Webhooks/index.tsx
    - src/src/octop/api/routers/webhooks.py
    - src/src/octop/overlay/migrations/002_webhook.pg.sql
    - src/src/octop/overlay/migrations/002_webhook.sql
    - src/src/octop/overlay/webhook/__init__.py
    - src/src/octop/overlay/webhook/dispatcher.py
    - src/src/octop/overlay/webhook/signing.py
    - src/src/octop/overlay/webhook/store.py
    - scripts/seed_provider.py
    - scripts/webhook_e2e.py
    - scripts/webhook_live_test.py
    - scripts/webhook_receiver.py
    - scripts/webhook_selfcheck.py
---
patch:
  id: workflow-ui
  name: Flows (list + create-flow screens on mock data; builder/engine land in later patches)
  target_repo: octop
  base_commit: 890111b7
  base_describe: v0.9.16-824-g890111b7
  base_tag: v1.0.3b1
  status: active
  doc: ../docs/04-FLOWS-ARCHITECTURE.md
  # Must sort AFTER agency and org-chart: patch_status.py and the Dockerfile apply patches
  # in file-name order, and these hunks sit next to the lines those patches add.
  applies_to:
    - dashboard/src/layouts/sidebarNav.tsx
    - dashboard/src/layouts/sidebarNavLayout.test.ts
    - dashboard/src/locales/en.json
    - dashboard/src/locales/zh.json
    - dashboard/src/routes/index.tsx
    - dashboard/src/routes/prefetch.ts
    - src/octop/infra/users/preferences.py   # SIDEBAR_NAV_KEYS whitelist
  adds:
    - src/dashboard/src/api/modules/flows.ts
    - src/dashboard/src/api/modules/flows.test.ts
    - src/dashboard/src/pages/Flows/
    - src/dashboard/src/locales/vi.json   # flows.* + nav.flows keys appended
